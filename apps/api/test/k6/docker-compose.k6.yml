name: k6-next-step

services:
  k6-postgres:
    image: postgres:17-alpine
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file:
      - ../../.env.k6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - k6-pg-data:/var/lib/postgresql/data
    networks:
      - k6-network

  k6-redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - k6-redis-data:/data
    networks:
      - k6-network

  k6-api:
    build:
      context: ../../
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.k6
    ports:
      - "${PORT}:8020"
    depends_on:
      k6-postgres:
        condition: service_healthy
      k6-redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8020/api/skills || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - k6-network

  k6:
    image: grafana/k6:latest
    working_dir: /k6
    volumes:
      - ./:/k6
    depends_on:
      k6-api:
        condition: service_healthy
    entrypoint: ["k6", "run", "load-test.js"]
    networks:
      - k6-network

volumes:
  k6-pg-data:
  k6-redis-data:

networks:
  k6-network:
    driver: bridge